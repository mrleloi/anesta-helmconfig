---
# Source: wordpress/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  labels:
    app.kubernetes.io/instance: wordpress
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/version: 6.4.3
    helm.sh/chart: wordpress-19.4.3
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: wordpress
      app.kubernetes.io/name: wordpress
  strategy:
    type: RollingUpdate
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: wordpress
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: wordpress
        app.kubernetes.io/version: 6.4.3
        helm.sh/chart: wordpress-19.4.3
    spec:
      initContainers:
          - name: cp-from-git
            command: ['/bin/sh', '-c',
               'rm -rf /temp/source/anesta;
                mkdir /temp/source/anesta;
                git clone https://$(GIT_USERNAME):$(GIT_PASSWORD)@bitbucket.baityapp.online/scm/wor/anesta.git --branch {{ .Values.branch | default "master" }} /temp/source/anesta;
                rm -rf /temp/source/anesta-config;
                mkdir /temp/source/anesta-config;
                git clone https://$(GIT_USERNAME):$(GIT_PASSWORD)@bitbucket.baityapp.online/scm/wor/anesta-config.git /temp/source/anesta-config;'
                ]
            env:
            - name: GIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cicd-anesta-bitbucket-loild
                  key: GIT_USERNAME
            - name: GIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cicd-anesta-bitbucket-loild
                  key: GIT_PASSWORD
            image: alpine/git
            imagePullPolicy: Always
            resources: {}
            terminationMessagePath: /dev/termination-log
            terminationMessagePolicy: File
            volumeMounts:
              - mountPath: /temp
                name: test-volume
      automountServiceAccountToken: false
      # yamllint disable rule:indentation
      hostAliases:
        - hostnames:
          - status.localhost
          ip: 127.0.0.1
      # yamllint enable rule:indentation
      affinity:
        podAffinity:
          
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: wordpress
                    app.kubernetes.io/name: wordpress
                topologyKey: kubernetes.io/hostname
              weight: 1
        nodeAffinity:
          
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: Always
        supplementalGroups: []
        sysctls: []
      serviceAccountName: wordpress
      containers:
        - name: wordpress
          image: docker.io/bitnami/wordpress:6.4.3-debian-12-r16
          imagePullPolicy: "IfNotPresent"
          lifecycle:
            postStart:
              exec:
                command: ['/bin/sh', '-c',
                  'cp -Rf /temp/source/anesta/ /bitnami/wordpress/;
                   cp -Rf /temp/source/anesta-config/wp-config.php.staging /bitnami/wordpress/wp-config.php;'
                  ]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1001
            seLinuxOptions: null
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: BITNAMI_DEBUG
              value: "false"
            - name: ALLOW_EMPTY_PASSWORD
              value: "yes"
            - name: WORDPRESS_SKIP_BOOTSTRAP
              value: "no"
            - name: MARIADB_HOST
              value: "82.180.162.37"
            - name: MARIADB_PORT_NUMBER
              value: "30306"
            - name: WORDPRESS_DATABASE_NAME
              value: "sql_baityapp_onl"
            - name: WORDPRESS_DATABASE_USER
              value: "root"
            - name: WORDPRESS_DATABASE_PASSWORD
              value: "123456a@A"
              # valueFrom:
              #   secretKeyRef:
              #     name: wordpress-externaldb
              #     key: mariadb-password
            - name: WORDPRESS_USERNAME
              value: "admin"
            - name: WORDPRESS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wordpress
                  key: wordpress-password
            - name: WORDPRESS_EMAIL
              value: "admin@baityapp.online"
            - name: WORDPRESS_FIRST_NAME
              value: "Admin"
            - name: WORDPRESS_LAST_NAME
              value: "Admin"
            - name: WORDPRESS_HTACCESS_OVERRIDE_NONE
              value: "no"
            - name: WORDPRESS_ENABLE_HTACCESS_PERSISTENCE
              value: "no"
            - name: WORDPRESS_BLOG_NAME
              value: "BaityApp"
            - name: WORDPRESS_TABLE_PREFIX
              value: "wp_"
            - name: WORDPRESS_SCHEME
              value: "http"
            - name: WORDPRESS_EXTRA_WP_CONFIG_CONTENT
              value: ""
            - name: WORDPRESS_PLUGINS
              value: "none"
            - name: WORDPRESS_OVERRIDE_DATABASE_SETTINGS
              value: "no"
            - name: APACHE_HTTP_PORT_NUMBER
              value: "8080"
            - name: APACHE_HTTPS_PORT_NUMBER
              value: "8443"
          envFrom:
          ports:
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
          livenessProbe:
            failureThreshold: 6
            httpGet:
              httpHeaders: []
              path: /wp-admin/install.php
              port: 'http'
              scheme: 'HTTP'
            initialDelaySeconds: 120
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          readinessProbe:
            failureThreshold: 6
            httpGet:
              httpHeaders: []
              path: /wp-login.php
              port: 'http'
              scheme: 'HTTP'
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 2000m
              memory: 1Gi
            requests:
              cpu: 200m
              memory: 512Mi
          volumeMounts:
            - mountPath: /bitnami/wordpress/wp-content/uploads/
              name: wordpress-uploads
            - mountPath: /temp
              name: temp-volume
      volumes:
        - name: wordpress-uploads
          persistentVolumeClaim:
            claimName: wordpress-uploads
        - name: temp-volume
          persistentVolumeClaim:
            claimName: temp-pvc
